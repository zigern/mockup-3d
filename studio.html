<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThreadLab Studio</title>
  </head>
  <body class="studio-page">
    <div class="studio-shell">
      <aside class="left-rail">
        <div class="rail-stack">
          <button type="button" class="rail-btn brand" title="Menu">◈</button>
          <button type="button" class="rail-btn" title="Back">←</button>
        </div>
        <div class="rail-stack">
          <button type="button" class="rail-btn active" title="Catalog">◻</button>
          <button type="button" class="rail-btn" title="Materials">◉</button>
          <button type="button" class="rail-btn" title="Garment">⌁</button>
          <button type="button" class="rail-btn" title="Upload">⤴</button>
          <button type="button" class="rail-btn" title="Settings">⚙</button>
        </div>
        <div class="rail-stack">
          <button type="button" class="rail-btn" id="fullscreenBtn" title="Fullscreen">⤢</button>
          <button type="button" class="rail-btn" title="Reset view">↺</button>
          <button type="button" class="rail-btn" title="Help">?</button>
        </div>
      </aside>

      <main class="studio-main">
        <header class="topbar">
          <nav class="menu-pill">
            <a class="studio-home-link" href="/index.html">HOME</a>
            <span>TOOLS</span>
            <span>CATALOG</span>
            <span>TEMPLATES</span>
            <span>PROJECTS</span>
          </nav>
          <div class="top-actions">
            <span class="top-badge">PRO ACCESS</span>
            <button id="exportBtn" class="top-export" type="button">EXPORT</button>
            <button type="button" class="top-icon">＋</button>
            <button type="button" class="top-icon">◌</button>
          </div>
        </header>

        <section class="workspace-grid">
          <section class="canvas-stage viewer-shell">
            <div class="viewer-top">
              <span>Preview</span>
              <span>Drag para rodar</span>
            </div>
            <div id="canvas-container"></div>
            <div class="canvas-bottom-tools">
              <button type="button">⧉</button>
              <button type="button">⌗</button>
              <button type="button">HQ</button>
            </div>
          </section>

          <aside class="inspector">
            <div class="product-head">
              <span class="thumb-dot"></span>
              <p>Oversized Sweatshirt</p>
              <span>⌄</span>
            </div>

            <details class="panel-block">
              <summary><span class="sum-left"><span class="sum-ico">◌</span>Mockup</span><span class="sum-arrow">⌄</span></summary>
            </details>

            <details class="panel-block">
              <summary><span class="sum-left"><span class="sum-ico">◍</span>Background</span><span class="sum-arrow">⌄</span></summary>
            </details>

            <details class="panel-block">
              <summary><span class="sum-left"><span class="sum-ico">◎</span>Environment</span><span class="sum-arrow">⌄</span></summary>
            </details>

            <details class="panel-block">
              <summary><span class="sum-left"><span class="sum-ico">☼</span>Lighting</span><span class="sum-arrow">⌄</span></summary>
            </details>

            <details class="panel-block">
              <summary><span class="sum-left"><span class="sum-ico">◔</span>Camera</span><span class="sum-arrow">⌄</span></summary>
            </details>

            <details class="panel-block">
              <summary><span class="sum-left"><span class="sum-ico">◍</span>Scene</span><span class="sum-arrow">⌄</span></summary>
            </details>

            <details class="panel-block">
              <summary><span class="sum-left"><span class="sum-ico">◌</span>Rotation</span><span class="sum-arrow">⌄</span></summary>
            </details>

            <details class="panel-block">
              <summary><span class="sum-left"><span class="sum-ico">◉</span>Position</span><span class="sum-arrow">⌄</span></summary>
            </details>

            <div class="support-controls">
              <input type="file" id="upload" accept="image/png,image/jpeg" hidden />
              <input type="file" id="bgImageUpload" accept="image/*" hidden />
              <button id="bgReset" type="button" class="sr-only">Reset</button>
              <input id="bgColor" type="color" value="#1f1f24" />
              <input type="color" id="colorPicker" value="#ffffff" />
              <div id="garmentSwatches" class="sr-only"></div>
              <div id="bgGrayStrip" class="sr-only"></div>
              <div id="bgPresetGroup" class="sr-only"></div>
              <div id="cameraAnimGroup" class="sr-only">
                <button type="button" data-camera-anim="off" class="icon-btn active">Off</button>
                <button type="button" data-camera-anim="orbit" class="icon-btn">Orbit</button>
                <button type="button" data-camera-anim="focus" class="icon-btn">Focus</button>
              </div>
              <div class="mini-range"><label>Design Size</label><input type="range" id="designSize" min="50" max="800" value="400" /><span id="sizeVal">400</span></div>
              <div class="mini-range"><label>Opacity</label><input type="range" id="designOpacity" min="10" max="100" value="100" /><span id="opacityVal">100</span></div>
              <div class="mini-range"><label>Acid Wash</label><input type="range" id="acidWash" min="0" max="100" value="0" /><span id="acidVal">0</span></div>
              <div class="mini-range"><label>Puff Print</label><input type="range" id="puffPrint" min="0" max="100" value="0" /><span id="puffVal">0</span></div>
              <div class="pill-grid" id="garmentAnimGroup">
                <button type="button" class="pill active" data-garment-anim="static"><span>Static</span><img class="pill-ico-img" src="/icons/anim-static.png" alt="" /></button>
                <button type="button" class="pill" data-garment-anim="walk"><span>Walk</span><img class="pill-ico-img" src="/icons/anim-walk.png" alt="" /></button>
                <button type="button" class="pill" data-garment-anim="waves"><span>Waves</span><img class="pill-ico-img" src="/icons/anim-knit.png" alt="" /></button>
                <button type="button" class="pill" data-garment-anim="knit"><span>Knit</span><img class="pill-ico-img" src="/icons/anim-waves.png" alt="" /></button>
              </div>
            </div>

            <div class="inspector-footer">
              <button type="button" class="mode-btn active">DESIGN</button>
              <button type="button" class="mode-btn">ANIMATION</button>
            </div>
          </aside>
        </section>

        <footer class="timeline-bar">
          <button type="button" class="play-btn">▶</button>
          <div class="timeline-track"><span class="tick"></span><span class="tick"></span><span class="tick"></span><span class="tick"></span><span class="tick"></span></div>
          <span class="timeline-time">00:10</span>
        </footer>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
